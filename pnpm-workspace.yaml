packages:
  - packages/*
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # The SDK and its per-platform CLI binaries ship in lockstep with Claude Code
  # releases; pinning them to "a day old" would block every CLI upgrade.
  - '@anthropic-ai/claude-agent-sdk'
  - '@anthropic-ai/claude-agent-sdk-*'
